    - id: code_route
      type: custom
      data:
        selected: false
        desc: ''
        type: code
        title: 路由判断
        code_language: python3
        code: |
          def main(check_body: str, check_status: int, clean_text: str) -> dict:
              """ok：继续分析；empty：没有任何内容；duplicate：同一份材料已分析过。"""
              import json

              if not clean_text.strip():
                  return {"route": "empty", "skip_message": "没有可分析的内容：请填写访谈记录或上传文件（若上传了文件，请检查文件处理错误）。"}
              if check_status != 200:
                  return {"route": "error", "skip_message": f"记忆服务异常（status={check_status}），未做分析。"}
              r = json.loads(check_body)
              if r.get("duplicate"):
                  return {"route": "duplicate",
                          "skip_message": f"这份材料之前已分析过（session {r.get('session_id')}），为避免重复计数已跳过。"}
              return {"route": "ok", "skip_message": ""}
        variables:
        - variable: check_body
          value_selector:
          - http_check
          - body
        - variable: check_status
          value_selector:
          - http_check
          - status_code
        - variable: clean_text
          value_selector:
          - code_prep
          - clean_text
        outputs:
          route:
            type: string
            children: null
          skip_message:
            type: string
            children: null
