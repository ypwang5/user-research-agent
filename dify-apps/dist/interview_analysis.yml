app:
  name: ② 访谈分析与计划
  description: 多模态访谈材料 → 脱敏 → 洞察提取（原话核对）→ 长期记忆去重计数 → 机会评分与行动计划
  icon: 🔎
  icon_background: '#E4FBCC'
  mode: workflow
  use_icon_as_answer_icon: false
kind: app
version: 0.7.0
dependencies: []
workflow:
  conversation_variables: []
  environment_variables:
  - id: env-memory-key
    name: MEMORY_API_KEY
    value_type: secret
    value: ''
    description: 记忆服务 API Key
  features:
    file_upload:
      enabled: false
    opening_statement: ''
    retriever_resource:
      enabled: false
    sensitive_word_avoidance:
      enabled: false
    speech_to_text:
      enabled: false
    suggested_questions: []
    suggested_questions_after_answer:
      enabled: false
    text_to_speech:
      enabled: false
  graph:
    nodes:
    - id: start
      type: custom
      data:
        selected: false
        desc: ''
        type: start
        title: 开始
        variables:
        - variable: project
          label: 调研方向（项目名，两个应用要一致）
          type: text-input
          required: true
          max_length: 128
          options: []
        - variable: interviewee_id
          label: 受访者编号（如 U03，不要填真名）
          type: text-input
          required: true
          max_length: 64
          options: []
        - variable: interviewee_profile
          label: 受访者画像（可选：行业/角色/规模）
          type: paragraph
          required: false
          max_length: 2000
          options: []
        - variable: real_names
          label: 需要脱敏的真实姓名（可选，逗号分隔）
          type: text-input
          required: false
          max_length: 512
          options: []
        - variable: transcript
          label: 访谈记录文字（可选，与文件二选一或都填）
          type: paragraph
          required: false
          max_length: 200000
          options: []
        - variable: files
          label: 访谈文件（文档/图片/音频/视频，可多个）
          type: file-list
          required: false
          max_length: 10
          options: []
          allowed_file_types:
          - document
          - image
          - audio
          - video
          allowed_file_extensions: []
          allowed_file_upload_methods:
          - local_file
          - remote_url
      position:
        x: 40
        y: 200
      positionAbsolute:
        x: 40
        y: 200
      width: 244
      height: 90
      selected: false
      sourcePosition: right
      targetPosition: left
    - id: http_extract
      type: custom
      data:
        selected: false
        desc: ''
        type: http-request
        title: 文件转文字
        method: post
        url: http://host.docker.internal:8000/v1/media/extract
        authorization:
          type: no-auth
          config: null
        headers: Authorization:Bearer {{#env.MEMORY_API_KEY#}}
        params: ''
        body:
          type: form-data
          data:
          - key: files
            type: file
            file:
            - start
            - files
          - key: project
            type: text
            value: '{{#start.project#}}'
        timeout:
          connect: 10
          read: 600
          write: 600
          max_connect_timeout: 0
          max_read_timeout: 0
          max_write_timeout: 0
        ssl_verify: true
        retry_config:
          enabled: true
          max_retries: 2
          retry_interval: 1000
          exponential_backoff:
            enabled: false
            multiplier: 2
            max_interval: 10000
      position:
        x: 360
        y: 200
      positionAbsolute:
        x: 360
        y: 200
      width: 244
      height: 90
      selected: false
      sourcePosition: right
      targetPosition: left
    - id: code_merge
      type: custom
      data:
        selected: false
        desc: ''
        type: code
        title: 合并材料
        code_language: python3
        code: |
          def main(transcript: str, extract_body: str, extract_status: int, real_names: str) -> dict:
              """合并文字记录与文件转写结果，生成脱敏请求。"""
              import json
              import re

              parts, errors = [], []
              if transcript and transcript.strip():
                  parts.append("### 访谈记录（文字）\n" + transcript.strip())
              if extract_status == 200:
                  data = json.loads(extract_body or "{}")
                  if data.get("text"):
                      parts.append(data["text"])
                  errors = [f"{i['filename']}：{i['error']}" for i in data.get("items", []) if "error" in i]
              elif extract_status:
                  errors = [f"文件处理接口异常 status={extract_status}"]
              names = [n.strip() for n in re.split(r"[,，、;；\s]+", real_names or "") if n.strip()]
              payload = {"text": "\n\n".join(parts), "names": names}
              return {"redact_payload": json.dumps(payload, ensure_ascii=False),
                      "media_errors": "\n".join(errors)}
        variables:
        - variable: transcript
          value_selector:
          - start
          - transcript
        - variable: extract_body
          value_selector:
          - http_extract
          - body
        - variable: extract_status
          value_selector:
          - http_extract
          - status_code
        - variable: real_names
          value_selector:
          - start
          - real_names
        outputs:
          redact_payload:
            type: string
            children: null
          media_errors:
            type: string
            children: null
