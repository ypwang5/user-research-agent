[project]
name = "memory-service"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "ypwang5", email = "user96313254@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "pydantic-settings>=2.16.1",
    "pymilvus>=3.0.2",
    "pypdf>=6.21.3",
    "python-docx>=1.2.0",
    "python-multipart>=0.0.32",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
memory-service = "memory_service:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
